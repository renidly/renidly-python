[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renidly"
version = "0.3.0"
description = "The official Python SDK for the Renidly B2B professional data APIs (Data, Live, Email, Account)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Renidly" }]
keywords = ["renidly", "b2b", "professional data", "enrichment", "email verification", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typing-extensions>=4.7",
]

[project.urls]
Homepage = "https://renidly.com"
Documentation = "https://github.com/renidly/renidly-python#readme"
Source = "https://github.com/renidly/renidly-python"
Issues = "https://github.com/renidly/renidly-python/issues"
Changelog = "https://github.com/renidly/renidly-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "mypy>=1.10", "ruff>=0.5", "pyyaml>=6", "build>=1"]

[tool.hatch.build.targets.wheel]
packages = ["src/renidly"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]   # the resource layer is intentionally one-line-per-endpoint

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "renidly.types.*"
ignore_errors = true
